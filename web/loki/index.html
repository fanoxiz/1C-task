<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Локи</title>
  <style>body { font: 18px/1.5 system-ui, sans-serif; max-width: 48rem; margin: 3rem auto; padding: 0 1rem; } label { display: block; margin: 1rem 0; } input, button { font: inherit; } input { display: block; width: 100%; box-sizing: border-box; } #error { color: #a22; } code { overflow-wrap: anywhere; }</style>
</head>
<body>
  <h1>Локи</h1>
  <form id="connection">
    <label>Адрес сервера <input id="server" type="url" required placeholder="http://127.0.0.1:8081"></label>
    <label>Имя при первой регистрации <input id="name" autocomplete="nickname"></label>
    <button id="connect" type="submit">Подключиться</button>
    <button id="disconnect" type="button">Отключиться</button>
  </form>
  <p id="status" role="status">Проверяем состояние клиента…</p>
  <p id="error" role="alert"></p>
  <div id="identity" hidden>
    <p>Ваше имя: <span id="display-name"></span></p>
    <p>Идентификатор: <code id="loki-id"></code></p>
  </div>
  <p id="notice" role="status"></p>
  <section id="invitation" hidden>
    <h2>Приглашение от Мобиуса</h2>
    <p id="invitation-side"></p>
    <p id="statistics"></p>
    <p>На ответ осталось: <span id="invitation-timer"></span></p>
    <button id="accept" type="button">Принять</button>
    <button id="decline" type="button">Отклонить</button>
  </section>
  <section id="game" hidden>
    <h2>Партия создана</h2>
    <p>ID: <code id="game-id"></code></p>
    <p id="game-side"></p>
    <p id="first-player"></p>
    <p>Совершение ходов пока недоступно.</p>
  </section>
  <script src="/app.js" defer></script>
</body>
</html>
