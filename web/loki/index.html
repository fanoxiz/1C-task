<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Локи</title>
  <link rel="stylesheet" href="/statistics.css">
  <link rel="stylesheet" href="/layout.css">
</head>
<body>
  <header class="page-header"><h1>Локи</h1></header>
  <main class="layout">
    <div class="sidebar">
      <section class="panel" aria-label="Подключение">
        <h2>Подключение</h2>
        <form id="connection">
          <label>Адрес сервера <input id="server" type="url" required placeholder="http://127.0.0.1:8081"></label>
          <label>Имя <input id="name" autocomplete="nickname"></label>
          <div class="actions">
            <button id="connect" type="submit">Подключиться</button>
            <button id="disconnect" type="button">Отключиться</button>
          </div>
        </form>
        <p id="status" role="status">Проверяем состояние клиента…</p>
        <p id="error" role="alert"></p>
      </section>
      <section id="identity" class="panel" hidden>
        <p>Идентификатор: <code id="loki-id"></code></p>
        <h2>Моя статистика</h2>
        <div id="own-statistics"></div>
      </section>
      <p id="notice" role="status"></p>
      <section id="invitation" class="panel" hidden>
        <h2>Приглашение от Мобиуса</h2>
        <p id="invitation-side"></p>
        <p>На момент приглашения</p>
        <div id="statistics"></div>
        <p>На ответ осталось: <span id="invitation-timer"></span></p>
        <div class="actions">
          <button id="accept" type="button">Принять</button>
          <button id="decline" type="button">Отклонить</button>
        </div>
      </section>
    </div>
    <section id="game" class="game-area" hidden>
      <div class="panel game-details">
        <h2>Партия</h2>
        <p>ID: <code data-game-id></code></p>
        <p data-sides></p>
        <p data-turn></p>
        <p data-result role="status"></p>
        <h3>Ходы</h3>
        <ol data-moves></ol>
        <button data-retry type="button" hidden>Повторить отправку хода</button>
        <p data-error role="alert"></p>
      </div>
      <div class="board-panel">
        <h2>Игровое поле</h2>
        <div data-board aria-label="Игровое поле"></div>
      </div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
